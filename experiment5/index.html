
<!DOCTYPE html>
<html>
<head>
    <title>Weather Today</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #eaf4ff;
            font-family: Arial, sans-serif;
            color: #183153;
        }

        .weather-box {
            max-width: 700px;
            margin: 45px auto;
            padding: 20px;
        }

        .top {
            text-align: center;
            margin-bottom: 25px;
        }

        .top h1 {
            font-size: 34px;
            font-weight: bold;
        }

        .top p {
            color: #657994;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            border: 1px solid #c8d9ed;
            border-radius: 10px;
            padding: 12px;
        }

        .search-btn {
            background: #246bfd;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
        }

        .search-btn:hover {
            background: #164fca;
        }

        .weather-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 5px 20px #cbdcf0;
        }

        .city-name {
            font-size: 25px;
            font-weight: bold;
        }

        .temperature {
            font-size: 60px;
            font-weight: bold;
            color: #246bfd;
            margin: 10px 0;
        }

        .weather-icon {
            font-size: 45px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 25px;
        }

        .detail-card {
            background: #f0f6ff;
            border-radius: 12px;
            padding: 18px 8px;
        }

        .detail-card p {
            margin-bottom: 5px;
            color: #657994;
        }

        .detail-card h5 {
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin: 15px 0;
        }

        @media (max-width: 500px) {
            .weather-box {
                margin: 20px auto;
            }

            .temperature {
                font-size: 48px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .search-box {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="weather-box">

        <div class="top">
            <h1>Weather Today</h1>
            <p>Check the weather conditions of your city</p>
        </div>

        <div class="search-box">
            <input type="text" id="city" class="form-control"
                   placeholder="Enter city name">
            <button class="search-btn" onclick="getWeather()">Search</button>
        </div>

        <p id="message"></p>

        <div class="weather-card">
            <div class="weather-icon" id="icon">🌤️</div>
            <div class="city-name" id="cityName">Search for a city</div>
            <div class="temperature" id="temperature">--°C</div>
            <p id="condition">Weather information will appear here</p>

            <div class="details">
                <div class="detail-card">
                    <p>Humidity</p>
                    <h5 id="humidity">--%</h5>
                </div>

                <div class="detail-card">
                    <p>Wind Speed</p>
                    <h5 id="wind">-- km/h</h5>
                </div>

                <div class="detail-card">
                    <p>Feels Like</p>
                    <h5 id="feels">--°C</h5>
                </div>
            </div>
        </div>

    </div>

    <script>
        async function getWeather() {
            var city = document.getElementById("city").value.trim();
            var message = document.getElementById("message");

            if (city == "") {
                message.innerText = "Please enter a city name.";
                return;
            }

            message.innerText = "Loading weather...";

            try {
                var url = "https://geocoding-api.open-meteo.com/v1/search?name="
                          + encodeURIComponent(city) + "&count=1";

                var response = await fetch(url);
                var data = await response.json();

                if (!data.results || data.results.length == 0) {
                    message.innerText = "City not found. Try another name.";
                    return;
                }

                var place = data.results[0];
                var lat = place.latitude;
                var lon = place.longitude;

                var weatherUrl = "https://api.open-meteo.com/v1/forecast?latitude="
                    + lat + "&longitude=" + lon
                    + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code";

                var weatherResponse = await fetch(weatherUrl);
                var weatherData = await weatherResponse.json();
                var current = weatherData.current;

                document.getElementById("cityName").innerText =
                    place.name + (place.country ? ", " + place.country : "");

                document.getElementById("temperature").innerText =
                    current.temperature_2m + "°C";

                document.getElementById("humidity").innerText =
                    current.relative_humidity_2m + "%";

                document.getElementById("wind").innerText =
                    current.wind_speed_10m + " km/h";

                document.getElementById("feels").innerText =
                    current.apparent_temperature + "°C";

                var code = current.weather_code;
                var condition = "Cloudy";
                var icon = "☁️";

                if (code == 0) {
                    condition = "Clear Sky";
                    icon = "☀️";
                } else if (code == 1 || code == 2) {
                    condition = "Partly Cloudy";
                    icon = "🌤️";
                } else if (code == 3) {
                    condition = "Overcast";
                    icon = "☁️";
                } else if (code >= 45 && code <= 48) {
                    condition = "Foggy";
                    icon = "🌫️";
                } else if (code >= 51 && code <= 67) {
                    condition = "Drizzle or Rain";
                    icon = "🌧️";
                } else if (code >= 71 && code <= 77) {
                    condition = "Snow";
                    icon = "❄️";
                } else if (code >= 80 && code <= 82) {
                    condition = "Rain Showers";
                    icon = "🌦️";
                } else if (code >= 95) {
                    condition = "Thunderstorm";
                    icon = "⛈️";
                }

                document.getElementById("condition").innerText = condition;
                document.getElementById("icon").innerText = icon;
                message.innerText = "Weather updated successfully.";

            } catch (error) {
                message.innerText = "Unable to get weather. Check your internet and try again.";
            }
        }

        document.getElementById("city").addEventListener("keypress", function(event) {
            if (event.key == "Enter") {
                getWeather();
            }
        });
    </script>

</body>
</html>

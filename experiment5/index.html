<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f2f2f2;
        }

        .weather-box {
            width: 500px;
            margin: 60px auto;
        }
    </style>
</head>

<body>

<div class="weather-box">

    <h2 class="text-center mb-4">Weather App</h2>

    <div class="input-group mb-3">
        <input type="text" id="city" class="form-control"
               placeholder="Enter city">

        <button class="btn btn-primary" onclick="getWeather()">
            Search
        </button>
    </div>

    <div id="weather" class="card p-3 text-center">
        Enter a city to check the weather.
    </div>

</div>


<script>

function getWeather() {

    var city = document.getElementById("city").value;

    if (city == "") {
        alert("Please enter a city");
        return;
    }

    fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + city + "&count=1")
        .then(response => response.json())
        .then(data => {

            if (!data.results) {
                document.getElementById("weather").innerText =
                    "City not found";
                return;
            }

            var latitude = data.results[0].latitude;
            var longitude = data.results[0].longitude;
            var cityName = data.results[0].name;

            fetch("https://api.open-meteo.com/v1/forecast?latitude="
                + latitude + "&longitude=" + longitude
                + "&current=temperature_2m,relative_humidity_2m,wind_speed_10m")
                .then(response => response.json())
                .then(data => {

                    document.getElementById("weather").innerHTML =
                        "<h4>" + cityName + "</h4>" +
                        "<p>Temperature: " +
                        data.current.temperature_2m + " °C</p>" +
                        "<p>Humidity: " +
                        data.current.relative_humidity_2m + " %</p>" +
                        "<p>Wind Speed: " +
                        data.current.wind_speed_10m + " km/h</p>";

                });

        })
        .catch(error => {
            document.getElementById("weather").innerText =
                "Something went wrong.";
        });
}

</script>

</body>
</html>
